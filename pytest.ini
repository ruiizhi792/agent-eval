[pytest]
testpaths = tests
addopts = -q

# pytest deletes old numbered temp directories once more than `tmp_path_retention_count`
# of them accumulate. That cleanup is a bulk delete, which some sandboxes/CI images
# guard against (it aborted a run here with SystemExit). Raising the retention count
# keeps the suite self-contained: tests still write to a fresh tmp dir, we simply do
# not mass-delete the old ones.
tmp_path_retention_count = 1000
